# Local Qwen3.8-27B (FP8, thinking on) served by vLLM on this machine (conda_envs/vllm, weights in /home/rag/data/hf_cache).
json_mode: false               # response_format json_object for the Designer's calls; only for endpoints that take it
#   CUDA_VISIBLE_DEVICES=4,5 HF_HOME=/home/rag/data/hf_cache conda_envs/vllm/bin/vllm serve Qwen/Qwen3.8-27B-FP8 --tensor-parallel-size 2 --gpu-memory-utilization 0.55 --max-model-len 131072 --reasoning-parser qwen3 --port 8000
# Used by method baseline_qwen in experiments/conditions.py.
provider: openai
model: Qwen/Qwen3.8-27B-FP8
base_url: http://localhost:8000/v1/
api_key_env: null             # local server without keys
request_timeout_s: null       # no time limit: Qwen thinks for minutes on long Designer calls
max_retries: 6
thinking_headroom_tokens: 32768  # thinking counts against max_tokens (llm/providers.py)
default_temperature: null
default_max_tokens: null
price_in_per_m: 0.0           # local: no API cost (GPU time is not counted here)
price_out_per_m: 0.0
global_cap_usd: 6000.0
soft_cap_usd: 4000.0
max_usd_per_hour: 150.0
ledger_path: run_data/llm_ledger.jsonl
episode_cost_multiplier: 2000.0
episode_call_multiplier: 2000.0
cache: false
cache_dir: run_data/llm_cache
log_root: run_data
