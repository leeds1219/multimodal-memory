# Same as llm_g38.yaml (token "g38mon") with runaway guards raised (runs with frequent reflection or long horizons).
# identical to llm.yaml except the model and its price.
model: gemini-3.8-flash
base_url: https://generativelanguage.googleapis.com/v1beta/openai/
api_key_file: env.yaml        # GOOGLE_API_KEY="..." (git-ignored); the GOOGLE_API_KEY environment variable wins
request_timeout_s: 300

# Retries: exponential backoff 2^k s (capped at 60 s), then raise.
max_retries: 6

# Gemini counts thinking tokens against max_tokens. Methods' max_tokens were
# set for non-thinking models (GPT-4o / Qwen) and bound the visible answer, so
# the layer sends method_max_tokens + thinking_headroom.
thinking_headroom_tokens: 32768

# Fallbacks used ONLY when a method's original code does not set them.
default_temperature: null     # null -> provider default
default_max_tokens: null

# Cost accounting (USD per 1M tokens). Thinking tokens are billed as output.
# gemini-3.8-flash list price through 2026-12-31 (ai.google.dev pricing, checked 2026-09-30).
price_in_per_m: 0.75
price_out_per_m: 3.75

# Runaway guards (safety, not a budget).
global_cap_usd: 6000.0                
# Tripwires against unattended waste: either one writes
# <log_root>/STOP_BUDGET; from then on every call fails at $0 until a human
# removes that file (see RESUME.md).
soft_cap_usd: 4000.0                  
max_usd_per_hour: 150.0               
ledger_path: run_data/llm_ledger.jsonl
episode_cost_multiplier: 2000.0         # reflection up to every step (~1140x the smoke rate)
episode_call_multiplier: 2000.0
# Smoke-test rates per env step (09-23), scaled by each episode's horizon.
episode_rates_per_step: {"optimus1": {"cost_per_step": 4.67e-06, "calls_per_step": 0.000877}, "deps": {"cost_per_step": 8.68e-05, "calls_per_step": 0.005737}, "mineevolve": {"cost_per_step": 0.000131, "calls_per_step": 0.007061}, "jarvis1": {"cost_per_step": 0.000129, "calls_per_step": 0.022831}}

# Response cache: OFF for evaluation; only for debugging.
cache: false
cache_dir: run_data/llm_cache

# Mock mode (offline checks): LLM_MOCK=1 routes calls to llm/mock.py.
log_root: run_data
