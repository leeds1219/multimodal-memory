note: >-
  Phase 1 / Phase 2 split of the 67 tasks (plan 2026-11-11). Each group is a level, played in this order in
  Phase 1 (train only); Phase 2 plays the test tasks, unseen in Phase 1. Train and test share subtasks within a group.
levels:
  - name: wooden
    train: [o1_wooden_00, o1_wooden_02, o1_wooden_04, o1_wooden_06, o1_wooden_08]   # shovel, axe, stick, sword, bowl
    test: [o1_wooden_01, o1_wooden_03, o1_wooden_05, o1_wooden_07, o1_wooden_09]    # pickaxe, hoe, crafting table, chest, ladder
  - name: stone
    train: [o1_stone_00, o1_stone_02, o1_stone_04, o1_stone_06, o1_stone_08]        # shovel, axe, charcoal, sword, torch
    test: [o1_stone_01, o1_stone_03, o1_stone_05, o1_stone_07]                      # pickaxe, hoe, smoker, furnace
  - name: iron
    train: [o1_iron_00, o1_iron_02, o1_iron_04, o1_iron_06, o1_iron_08, o1_iron_10, o1_iron_12, o1_iron_14]  # shovel, axe, bucket, rail, shears, tripwire hook, iron bars, blast furnace
    test: [o1_iron_01, o1_iron_03, o1_iron_05, o1_iron_07, o1_iron_09, o1_iron_11, o1_iron_13, o1_iron_15]   # pickaxe, hoe, hopper, sword, smithing table, chain, nugget, stonecutter
  - name: gold
    train: [o1_gold_00, o1_gold_02, o1_gold_04]          # shovel, axe, sword
    test: [o1_gold_01, o1_gold_03, o1_gold_05]           # pickaxe, hoe, gold ingot
  - name: redstone
    train: [o1_redstone_00, o1_redstone_02, o1_redstone_04]   # piston, activator rail, dropper
    test: [o1_redstone_01, o1_redstone_03, o1_redstone_05]    # redstone torch, compass, note block
  - name: diamond
    train: [o1_diamond_00, o1_diamond_02, o1_diamond_04, o1_diamond_05]   # shovel, axe, sword, mine a diamond
    test: [o1_diamond_01, o1_diamond_03, o1_diamond_06]                   # pickaxe, hoe, jukebox
  - name: armor
    train: [o1_armor_00, o1_armor_01, o1_armor_03, o1_armor_05, o1_armor_07, o1_armor_09, o1_armor_11]  # shield, iron chestplate, iron leggings, diamond helmet, diamond leggings, golden helmet, golden boots
    test: [o1_armor_02, o1_armor_04, o1_armor_06, o1_armor_08, o1_armor_10, o1_armor_12]               # iron boots, iron helmet, diamond chestplate, diamond boots, golden leggings, golden chestplate
