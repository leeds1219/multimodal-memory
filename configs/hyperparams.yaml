# Hyperparameters of the method and the agent: the only place to change them (hyperparams.py reads this file).
loop:  # the learning-from-failure loop (experiments/ours_loop.py)
  rollouts: 5                  # rollouts per hypothesis from the same restart point, taken as independent trials
  window_steps: 3000           # steps after the restart point a rollout plays to show the occurrence
  save_every: 600              # world saves in every loop episode (the restart points)
  stall_steps: 3000            # a continuation stops after this many steps without a new milestone
  max_experiments: 10          # hypotheses tested per attempt
  tries_per_failure_point: 3   # hypotheses at one failure point before the next one
phase1:  # memory collection on the train tasks (experiments/phase1.py)
  seed_offsets: [0, 1, 4]      # every train task once per world (A, B, C); no budget cut while it runs, the memory
                               # is saved after every episode and the budget is cut afterwards
executor:  # the agent (domains/minecraft/agent/)
  history_turns: 10            # earlier commands shown each turn
  max_tokens: 500              # the agent's answer per turn
  plan_max_tokens: 800         # the initial plan (--plan)
  stall_turns: 30              # turns in a row that ran <= 1 step and changed nothing -> the episode stops
  min_steps_per_call: 5        # VLM calls <= horizon / this
world:  # the nolava world (domains/minecraft/world/nolava.py)
  nolava_every: 10             # steps between lava fills
  nolava_radius: 12            # half size of the filled box
optimus1_memory:  # Optimus-1's HDKG + AMEP on the Baseline agent (memory/optimus1_memory.py)
  buffer_frames: 16            # AMEP image buffer per experience (paper App. E.1.1)
  frame_px: [320, 180]         # stored and shown frame size
  frames_shown: 2              # frames shown per retrieved case: the first and the last (the release's before/now pair)
  reflect_every_steps: 1200    # periodic check: cases shown and a CONTINUE window closed (the release's 1 game minute)
  cases_per_verdict: 1         # retrieved cases per verdict (COMPLETE, CONTINUE, REPLAN)
  min_subgoal_similarity: 0.5  # a case is retrieved only if its sub-goal is at least this similar (difflib ratio)
  tool_share: 0.5              # HDKG: a tool is shown for a gathered item if it was in the inventory in this share of gathers
