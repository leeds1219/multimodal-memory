# @package _global_
llm:
  provider: gemini
  model: gemini-3-flash-preview   # paper model; plain "gemini-3-flash" does not exist. API returns 404 "no longer available to new users" for 2.5-flash (seen 2026-09-18); 3.x Flash are thinking models
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  api_key: null         # null -> read from env GOOGLE_API_KEY
  timeout: 120.0
  temperature: 0.2
  max_tokens: 8192      # thinking model; the server reads MINEEVOLVE_LLM_MAX_TOKENS (set by scripts/server_gemini.sh)
